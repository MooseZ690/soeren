{% extends 'base.html' %}
{% block body %}
    <div class="box contact">
        <div class="contact-heading"><h1 class="fa-brands fa-google-drive"></h1><h1>&nbsp Submit email</h1></div>

        <form action="{{ url_for('sendemail') }}" method="POST" class="contact-form">
            <input type="text" id="name" name="name" placeholder="Name" required>

            <input type="email" id="email" name="email" placeholder="Email" required>

            <div class="delivery-toggle">
                <span class="delivery-option active" id="delivery-label-drive">Drive link</span>

                <label class="switch">
                    <input type="checkbox" id="booking" name="booking" value="1"
                        onchange="document.getElementById('delivery-label-drive').classList.toggle('active', !this.checked);
                                  document.getElementById('delivery-label-meeting').classList.toggle('active', this.checked);">
                    <span class="switch-track"></span>
                </label>

                <span class="delivery-option" id="delivery-label-meeting">Video meeting</span>
            </div>

            <button class="button-submit contact-submit" type="submit">Submit</button>
        </form>
    </div>
{% endblock %}
